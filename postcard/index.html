<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Jolly+Lodger&family=Montserrat:wght@300;500;700&family=Nosifer&display=swap" rel="stylesheet">

<body class="night_color">

            <div class="cloud"></div>

            <div class="moon">

        <section class="site_content">

                </div>
                
                <section class="section_Pumpkin">
                    
                    
                    
                    <div class="Pumpkin">
                        <div class="Pumpkin_item">
                        </div>

                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div> 
                        </div>
                        
                        <div class="mouth">
                            <div class="tooth"></div>
                            <div class="tooth"></div>
                        </div>
                    </div>
                
                </section>
            </article>
        </section>

        <div class="animations">

            <div class="Pumpkins">🎃</div>
